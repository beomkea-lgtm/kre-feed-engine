name: diag
on:
  push:
    branches: [main]
    paths: [".trigger-diag"]
jobs:
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "psycopg[binary]"
      - run: python .github/diag/dbcheck.py
