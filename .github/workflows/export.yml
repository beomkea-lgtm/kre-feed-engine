name: export
on:
  push:
    branches: [main]
    paths: [".trigger-export", ".trigger-export-links"]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "psycopg[binary]"
      - name: export + encrypt (only the holder of the private key can read it)
        run: |
          python .github/export_loans.py "$RUNNER_TEMP/loans.csv"
          python .github/export_links.py "$RUNNER_TEMP/links.csv"
          for n in loans links; do
            openssl rand -out "$RUNNER_TEMP/k.bin" 32
            openssl enc -aes-256-cbc -pbkdf2 -salt -in "$RUNNER_TEMP/$n.csv" -out exports/$n.csv.enc -pass file:"$RUNNER_TEMP/k.bin"
            openssl pkeyutl -encrypt -pubin -inkey .github/export_pub.pem -in "$RUNNER_TEMP/k.bin" -out exports/$n.key.enc
          done
          git config user.name "kre-feed bot"; git config user.email "bot@users.noreply.github.com"
          git add exports/*.enc
          git commit -m "export (encrypted)" && git push
