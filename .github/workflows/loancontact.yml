name: loancontact
on:
  push:
    branches: [main]
    paths: [".trigger-loancontact"]
concurrency:
  group: loancontact
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      NAVER_CLIENT_ID_2: ${{ secrets.NAVER_CLIENT_ID_2 }}
      NAVER_CLIENT_SECRET_2: ${{ secrets.NAVER_CLIENT_SECRET_2 }}
      LOAN_CONTACT_ALL: "1"
      LOAN_CONTACT_SHEET: "1"   # 시트 '대출모집법인' 줄만
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: before
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"]) as c:
              print("시트 대출모집법인 (곳, 메일, 전화) 전:", c.execute("select count(*), count(*) filter (where coalesce(email,'')<>''), count(*) filter (where coalesce(phone,'')<>'') from sheet_rows where kind='loan'").fetchone())
          PY
      - name: 1. 홈페이지·카카오·웹 문서
        run: python -m kre_feed.loancontact
      - name: 2. 메일 찾기 엔진 (블로그·카페·지식iN·다음·전화 역검색) — 대출모집법인만 다시
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"]) as c:
              n = c.execute("""update leads set email_checked_at = null, email_depth = 0
                               where type = 'loan_broker' and status <> 'hidden' and coalesce(contact->>'email','') = ''""").rowcount
              print("다시 볼 대출모집법인", n)
          PY
          EMAIL_FOCUS='["loan_broker"]' EMAIL_DAILY_LEADS=60 EMAIL_PAGE_BUDGET=3000 EMAIL_DAILY_REGIONS=0 python -m kre_feed emails
      - name: after
        if: always()
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"]) as c:
              print("시트 대출모집법인 (곳, 메일, 전화) 후:", c.execute("select count(*), count(*) filter (where coalesce(email,'')<>''), count(*) filter (where coalesce(phone,'')<>'') from sheet_rows where kind='loan'").fetchone())
              print("메일 후보(확인 필요):", c.execute("select count(distinct c.lead_id) from email_candidates c join leads l on l.id=c.lead_id where l.type='loan_broker' and c.status='candidate'").fetchone())
          PY
